<!doctype html>
<!-- Notification center with type filters, a rendered feed, and bulk actions. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="notifications.title">Notifications</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <!-- Notifications screen contains filtering, the rendered feed, and bulk actions. -->
    <div class="appContainer">
      <!-- Shared page header returns to the dashboard and labels the current screen. -->
      <header class="modernHeader">
        <button class="modernBackButton" onclick="goBack()">
          <img
            data-icon-folder="navigation" data-icon-name="back"
            class="icon navigationIcon"
            alt="Back"
          />
        </button>
        <h1 class="modernPageTitle" data-i18n="notifications.title">
          Notifications
        </h1>
      </header>
      <!-- Notification filters and bulk actions operate on the feed in this region. -->
      <main class="pageContent">
        <!-- Filter the feed by notification type or read status. -->
        <div class="notificationFilterBar">
          <button
            class="notificationFilterButton activeNotificationFilter"
            onclick="filterNotifications('all', this)"
            data-i18n="notifications.all"
          >
            All
          </button>
          <button
            class="notificationFilterButton"
            onclick="filterNotifications('unread', this)"
            data-i18n="notifications.unread"
          >
            Unread
          </button>
          <button
            class="notificationFilterButton"
            onclick="filterNotifications('item', this)"
            data-i18n="notifications.items"
          >
            Items
          </button>
          <button
            class="notificationFilterButton"
            onclick="filterNotifications('budget', this)"
            data-i18n="notifications.budget"
          >
            Budget
          </button>
          <button
            class="notificationFilterButton"
            onclick="filterNotifications('group', this)"
            data-i18n="notifications.groups"
          >
            Groups
          </button>
          <button
            class="notificationFilterButton"
            onclick="filterNotifications('system', this)"
            data-i18n="notifications.system"
          >
            System
          </button>
        </div>
        <!-- JavaScript renders the filtered notification cards into this mount point. -->
        <div id="notificationList"></div>
        <div class="bottomActionBar">
          <button
            class="secondaryButton"
            onclick="markAllNotificationsRead()"
            data-i18n="notifications.markAllRead"
          >
            Mark All Read
          </button>
          <button
            class="dangerButton"
            onclick="clearNotifications()"
            data-i18n="notifications.clearAll"
          >
            Clear All
          </button>
        </div>
      </main>
    </div>
    <!-- Load shared state and page services before the bootstrap starts the screen. -->
    <script src="../js/stateManager.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/localization/languageManager.js"></script>
    <script src="../js/notificationsPage.js"></script>
    <script src="../js/bootstrap.js"></script>
    <!-- Start localization and render the notification feed after markup is ready. -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        initializeApplication();
      });
    </script>
  </body>
</html>
