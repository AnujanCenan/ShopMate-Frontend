<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="dashboard.title">ShopMate Dashboard</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="appContainer">
      <!-- Dashboard Header -->
      <header class="dashboardHeader">
        <div class="headerLeftSection">
          <img
            src="../assets/logos/shopMateLogo.png"
            alt="ShopMate Logo"
            class="appLogo"
          />
          <h1 class="appName" data-i18n="common.appName">ShopMate</h1>
        </div>
        <button type="button" class="menuButton" aria-label="Open Menu">
          <img
            src="../assets/icons/navigation/menu.svg"
            class="icon navigationIcon"
            alt=""
          />
        </button>
      </header>
      <!-- Main Dashboard -->
      <main class="pageContent">
        <!-- Group Selector -->
        <section class="groupDropdownSection">
          <button
            type="button"
            class="groupDropdownButton"
            id="groupDropdownButton"
          >
            <span id="selectedGroupName" data-i18n="dashboard.noGroupSelected">
              No Group Selected
            </span>
            <span class="dropdownArrow">
              <img
                src="../assets/icons/navigation/collapse.svg"
                class="icon smallIcon"
                alt=""
              />
            </span>
          </button>
        </section>
        <!-- Budget Dashboard -->
        <section
          id="budgetDashboardWidget"
          class="budgetDashboardWidget"
        ></section>
        <!-- Empty State -->
        <section class="emptyStateSection" id="emptyStateSection">
          <p class="emptyStateText" data-i18n="dashboard.selectOrCreateGroup">
            Select or create a group
          </p>
        </section>
        <!-- Categories -->
        <section class="categoryList" id="categoryList"></section>
      </main>
      <!-- Footer -->
      <footer class="appFooter" data-i18n="common.footer">
        © Wisemen IT Solutions
      </footer>
      <!-- Floating Action Button -->
      <button
        type="button"
        class="floatingActionButton"
        id="openCategoryBottomSheetButton"
        aria-label="Add Category"
      >
        <img
          src="../assets/icons/actions/add.svg"
          class="icon largeIcon"
          alt=""
        />
      </button>
      <!-- Side Drawer Overlay -->
      <div
        class="sideDrawerOverlay"
        id="sideDrawerOverlay"
        onclick="closeSideDrawer()"
      ></div>
      <!-- Side Drawer -->
      <aside class="sideDrawer right" id="sideDrawer"></aside>
      <!-- Bottom Sheet Overlay -->
      <div
        id="screenOverlay"
        class="screenOverlay hidden"
        onclick="closeBottomSheet()"
      ></div>
      <!-- Bottom Sheet -->
      <section class="bottomSheet hidden" id="bottomSheet">
        <div class="bottomSheetHandle"></div>
        <div class="bottomSheetContent" id="bottomSheetContent"></div>
      </section>
    </div>
    <!-- CORE APPLICATION FILES -->
    <script src="../js/stateManager.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/authManager.js"></script>
    <!-- LOCALIZATION FRAMEWORK -->
    <script src="../js/localization/localizationRegistry.js"></script>
    <script src="../js/localization/languageManager.js"></script>
    <script src="../js/localization/localizationBootstrap.js"></script>
    <!-- APPLICATION BOOTSTRAP -->
    <script src="../js/bootstrap.js"></script>
    <!-- DASHBOARD -->
    <script src="../js/dashboardPage.js"></script>
    <script src="../js/budgetService.js"></script>
    <script src="../js/categoryService.js"></script>
    <script src="../js/dashboardService.js"></script>
    <script src="../js/snackbarManager.js"></script>

    

    
    <!-- APPLICATION INITIALIZATION -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        initializeApplication();
      });
    </script>
  </body>
</html>
