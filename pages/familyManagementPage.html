<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="groupManagement.title">Group Management</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="appContainer">
      <header class="modernHeader">
        <button class="modernBackButton" onclick="goBack()">
          <img
            src="../assets/icons/navigation/back.svg"
            class="icon navigationIcon"
            alt="Back"
          />
        </button>
        <h1 class="modernPageTitle" data-i18n="groupManagement.title">
          Group Management
        </h1>
      </header>
      <main class="pageContent">
        <div id="groupManagementContainer"></div>
        <div id="groupSwitcherContainer"></div>
        <section
          class="readOnlyBanner hidden"
          id="readOnlyBanner"
          data-i18n="groupManagement.readOnlyAccess"
        >
          You have read-only access in this group.
        </section>
      </main>
      <div
        id="screenOverlay"
        class="screenOverlay hidden"
        onclick="closeBottomSheet()"
      ></div>
      <div class="bottomSheet hidden" id="bottomSheet">
        <div class="bottomSheetHandle"></div>
        <div class="bottomSheetContent" id="bottomSheetContent"></div>
      </div>
    </div>
    <script src="../js/stateManager.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/authManager.js"></script>
    <script src="../js/groupService.js"></script>

    <script src="../js/localization/languageManager.js"></script>
    <script src="../js/groupManagement.js"></script>
    <script src="../js/bootstrap.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        initializeApplication();
      });
    </script>
  </body>
</html>
