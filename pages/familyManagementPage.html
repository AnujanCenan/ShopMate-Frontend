<!doctype html>
<!-- Group collaboration screen for member roles, invitations, and group switching. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="groupManagement.title">Group Management</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <!-- Group-management screen provides member, invitation, and group-switcher mount points. -->
    <div class="appContainer">
      <!-- Shared page header returns to the previous screen and names this view. -->
      <header class="modernHeader">
        <button class="modernBackButton" onclick="goBack()">
          <img
            data-icon-folder="navigation" data-icon-name="back"
            class="icon navigationIcon"
            alt="Back"
          />
        </button>
        <h1 class="modernPageTitle" data-i18n="groupManagement.title">
          Group Management
        </h1>
      </header>
      <!-- Group details and the read-only notice are mounted inside the main content. -->
      <main class="pageContent">
        <!-- Group cards and their member/invitation details are rendered here. -->
        <div id="groupManagementContainer"></div>
        <!-- The current group selector is rendered independently from group details. -->
        <div id="groupSwitcherContainer"></div>
        <!-- Shows members that actions are restricted when the current role is read-only. -->
        <section
          class="readOnlyBanner hidden"
          id="readOnlyBanner"
          data-i18n="groupManagement.readOnlyAccess"
        >
          You have read-only access in this group.
        </section>
      </main>
      <div
        id="screenOverlay"
        class="screenOverlay hidden"
        onclick="closeBottomSheet()"
      ></div>
      <div class="bottomSheet hidden" id="bottomSheet">
        <div class="bottomSheetHandle"></div>
        <div class="bottomSheetContent" id="bottomSheetContent"></div>
      </div>
    </div>
    <!-- Load shared group services and screen handlers before the page bootstrap. -->
    <script src="../js/constants/server_endpoint.js"></script>
    <script src="../js/stateManager.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/authManager.js"></script>
    <script src="../js/groupService.js"></script>

    <script src="../js/localization/languageManager.js"></script>
    <script src="../js/groupManagement.js"></script>
    <script src="../js/bootstrap.js"></script>
    <!-- Initialize group data and render the page after the DOM is ready. -->
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        initializeApplication();
      });
    </script>
  </body>
</html>
