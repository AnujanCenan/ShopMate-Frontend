<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="settings.title">Settings</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="appContainer">
      <header class="modernHeader">
        <button class="modernBackButton" onclick="goBack()">
          <img
            data-icon-folder="navigation" data-icon-name="back"
            class="icon navigationIcon"
            alt=""
          />
        </button>
        <h1 class="modernPageTitle" data-i18n="settings.title">Settings</h1>
      </header>
      <main class="pageContent">
        <!-- Account -->
        <section class="settingsSection">
          <h2 class="settingsSectionTitle" data-i18n="settings.account">
            Account
          </h2>
          <button class="settingsCard" onclick="openProfilePage()">
            <img
              data-icon-folder="features" data-icon-name="profile"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.profile"> My Profile </span>
          </button>
          <button class="settingsCard" onclick="openSecuritySettings()">
            <img
              data-icon-folder="biometric" data-icon-name="fingerprint"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.security"> Security </span>
          </button>
        </section>

        <!-- Preferences -->
        <section class="settingsSection">
          <h2 class="settingsSectionTitle" data-i18n="settings.preferences">
            Preferences
          </h2>
          <button class="settingsCard" onclick="openThemeSettings()">
            <img
              data-icon-folder="features" data-icon-name="dark-mode"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.theme"> Theme </span>
          </button>
          <button class="settingsCard" onclick="openNotificationSettings()">
            <img
              data-icon-folder="features" data-icon-name="notification"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.notifications"> Notifications </span>
          </button>
          <button class="settingsCard" onclick="openLanguageSettings()">
            <img
              data-icon-folder="features" data-icon-name="language"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.language"> Language </span>
          </button>
        </section>
        <!-- Shopping -->
        <section class="settingsSection">
          <h2 class="settingsSectionTitle" data-i18n="settings.shopping">
            Shopping
          </h2>
          <button class="settingsCard" onclick="setCurrency()">
            <img
              data-icon-folder="features" data-icon-name="budget"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.currency"> Currency </span>
          </button>
          <button class="settingsCard" onclick="setMeasurementUnit()">
            <img
              data-icon-folder="features" data-icon-name="measurement"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.measurementUnits">
              Measurement Units
            </span>
          </button>
        </section>
        <!-- Data -->
        <section class="settingsSection">
          <h2 class="settingsSectionTitle" data-i18n="settings.data">Data</h2>
          <button class="settingsCard" onclick="exportAppData()">
            <img
              data-icon-folder="features" data-icon-name="export"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.exportData"> Export Data </span>
          </button>
          <button
            class="settingsCard"
            onclick="document.getElementById('importBackupInput').click()"
          >
            <img
              data-icon-folder="features" data-icon-name="import"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.importData"> Import Data </span>
          </button>
          <button
            class="settingsCard dangerSettingsCard"
            onclick="clearLocalData()"
          >
            <img
              data-icon-folder="actions" data-icon-name="delete"
              class="icon actionIcon"
              alt=""
            />
            <span data-i18n="settings.clearLocalData"> Clear Local Data </span>
          </button>
          <input
            type="file"
            id="importBackupInput"
            accept=".json"
            hidden
            onchange="importAppData(event)"
          />
        </section>
        <!-- Support -->
        <section class="settingsSection">
          <h2 class="settingsSectionTitle" data-i18n="settings.support">
            Support
          </h2>
          <button class="settingsCard" onclick="showAboutShopMate()">
            <img
              data-icon-folder="features" data-icon-name="about"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.about"> About ShopMate </span>
          </button>
          <button class="settingsCard" onclick="openPrivacyPolicy()">
            <img
              data-icon-folder="features" data-icon-name="privacy"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.privacyPolicy"> Privacy Policy </span>
          </button>
          <button class="settingsCard" onclick="openTermsConditions()">
            <img
              data-icon-folder="features" data-icon-name="document"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.termsConditions">
              Terms & Conditions
            </span>
          </button>
          <button class="settingsCard" onclick="sendFeedback()">
            <img
              data-icon-folder="features" data-icon-name="feedback"
              class="icon featureIcon"
              alt=""
            />
            <span data-i18n="settings.sendFeedback"> Send Feedback </span>
          </button>
        </section>
      </main>
    </div>
    <!-- Screen Overlay -->
    <div
      class="screenOverlay hidden"
      id="screenOverlay"
      onclick="closeBottomSheet()"
    ></div>
    <!-- Bottom Sheet -->
    <div class="bottomSheet hidden" id="bottomSheet">
      <div class="bottomSheetHandle"></div>
      <div id="bottomSheetContent"></div>
    </div>
    <script src="../js/stateManager.js"></script>
    <script src="../js/authManager.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/settingsPage.js"></script>
    <script src="../js/localization/languageManager.js"></script>
    <script src="../js/bootstrap.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        initializeApplication();
      });
    </script>
  </body>
</html>
