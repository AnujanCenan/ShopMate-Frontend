<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="invite.title">Invite</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="authPage">
      <div class="authCard">
        <h1 class="authTitle" data-i18n="invite.groupInvitation">
          Group Invitation
        </h1>
        <p class="authSubtitle" data-i18n="invite.invitedToJoin">
          You were invited to join a group
        </p>
        <input
          type="text"
          class="authInput"
          id="inviteCodeInput"
          placeholder="Invite Code"
          data-i18n-placeholder="invite.inviteCode"
        />
        <button
          class="authButton"
          onclick="processInvite()"
          data-i18n="common.continue"
        >
          Continue
        </button>
      </div>
    </div>
    <script src="../js/stateManager.js"></script>
    <script src="../js/authManager.js"></script>
    <script src="../js/localization/languageManager.js"></script>
    <script src="../js/bootstrap.js"></script>
    <script>
      function processInvite() {
        const inviteCode = document
          .getElementById("inviteCodeInput")
          .value.trim();
        if (!appState.loggedIn) {
          localStorage.setItem("pendingInvite", inviteCode);
          window.location.href = "./registerPage.html";
          return;
        }
        joinGroupFromInvite(inviteCode);
      }
      document.addEventListener("DOMContentLoaded", function () {
        initializeApplication();
      });
    </script>
  </body>
</html>
