<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShopMate Login</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="authPage">
      <div class="authCard">
        <div class="authLogoSection">
          <div class="authLogoPlaceholder">
            <img
              class="authLogo"
              src="../assets/logos/shopMateLogo.png"
              alt="ShopMate Logo"
            />
          </div>
          <p class="authTagline">Manage your shopping together</p>
        </div>
        <input
          type="email"
          placeholder="Email Address"
          class="authInput"
          id="loginEmailInput"
        />
        <input
          type="password"
          placeholder="Password"
          class="authInput"
          id="loginPasswordInput"
        />
        <div class="authBiometricRow">
          <button class="biometricButton" onclick="unlockApplication()">
            <img
              src="../assets/icons/biometric/fingerprint.svg"
              class="actionIcon"
              alt="Edit"
            />
          </button>
          <span class="authOrText"> OR </span>
          <button class="biometricButton" onclick="unlockApplication()">
            <img
              src="../assets/icons/biometric/faceid.svg"
              class="actionIcon"
              alt="Edit"
            />
          </button>
        </div>
        <button class="authButton" onclick="loginUserMySQL()">LOGIN</button>
        <button
          class="authTextButton forgotPasswordButton"
          onclick="renderForgotPasswordForm()"
        >
          Forgot Password?
        </button>
        <div class="authDivider">
          <span>OR</span>
        </div>
        <button
          class="secondaryButton authRegisterButton"
          onclick="window.location.href = './registerPage.html'"
        >
          Create Shopping Group
        </button>

        <p class="authInviteText">Been invited to join a shopping group?</p>
        <p class="authInviteSubText">
          Use the invitation email sent to your registered email address.
        </p>
      </div>
    </div>
    <div class="screenOverlay hidden" id="screenOverlay"></div>
    <div class="bottomSheet hidden" id="bottomSheet">
      <div class="bottomSheetHandle"></div>
      <div class="bottomSheetContent" id="bottomSheetContent"></div>
    </div>
    <script src="../js/stateManager.js"></script>
    <script src="../js/helpers.js"></script>
    <!-- <script src="../js/bottomSheet.js"></script> -->
    <script src="../js/authManager.js"></script>
  </body>
</html>
