<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Shopping Group</title>
    <link rel="stylesheet" href="../css/app.css" />
  </head>
  <body>
    <div class="authPage">
      <div class="authCard">
        <h1 class="authTitle">Register</h1>
        <input
          type="text"
          placeholder="First Name"
          class="authInput"
          id="registerFirstNameInput"
        />
        <input
          type="text"
          placeholder="Last Name"
          class="authInput"
          id="registerLastNameInput"
        />
        <input
          type="email"
          placeholder="Email Address"
          class="authInput"
          id="registerEmailInput"
        />
        <input
          type="password"
          placeholder="Password"
          class="authInput"
          id="registerPasswordInput"
        />
        <input
          type="password"
          placeholder="Confirm Password"
          class="authInput"
          id="registerConfirmPasswordInput"
        />
        <input
          type="text"
          placeholder="Group Name"
          class="authInput"
          id="groupNameInput"
        />
        <label class="biometricToggle">
          <input type="checkbox" id="biometricCheckbox" />
          Protect ShopMate with Biometrics
        </label>
        <button class="authButton" onclick="registerUser()">
          Create Group
        </button>

        <button
          class="authTextButton"
          onclick="window.location.href = './loginPage.html'"
        >
          Already have an account? Login
        </button>
      </div>
    </div>
    <script src="../js/stateManager.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../js/authManager.js"></script>
  </body>
</html>
